
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
  <title>Pokemon Magazine</title>
</head>

<body>
  <div class="flipbook">
    <img src="pages/1.1.png" alt="" />
  </div> 

<div class="navigation-controls">
  <button id="first-page" class="icon-btn" aria-label="Pierwsza">
    <title>Pierwsza</title>
    <!-- double left (first) -->
    <svg viewBox="0 0 24 24" width="24" height="24" role="img" focusable="false" aria-hidden="true">
      <path d="M18 6 L12 12 L18 18 M12 6 L6 12 L12 18"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <button id="prev-page" class="icon-btn" aria-label="Poprzednia">
    <title>Poprzednia</title>
    <!-- single left (prev) -->
    <svg viewBox="0 0 24 24" width="24" height="24" role="img" focusable="false" aria-hidden="true">
      <path d="M15 6 L9 12 L15 18"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <button id="next-page" class="icon-btn" aria-label="Następna">
    <title>Następna</title>
    <!-- single right (next) -->
    <svg viewBox="0 0 24 24" width="24" height="24" role="img" focusable="false" aria-hidden="true">
      <path d="M9 6 L15 12 L9 18"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <button id="last-page" class="icon-btn" aria-label="Ostatnia">
    <title>Ostatnia</title>
    <!-- double right (last) -->
    <svg viewBox="0 0 24 24" width="24" height="24" role="img" focusable="false" aria-hidden="true">
      <path d="M6 6 L12 12 L6 18 M12 6 L18 12 L12 18"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>


<script src="jquery.js"></script>
  <script src="turn.js"></script>
  <script>
    const totalPages = 58;
    const flipbook = document.querySelector(".flipbook");
    for(let i = 2; i <= totalPages; i++){
        for(let j = 1; j <= 2; j++){
            const img = document.createElement("img");
            img.src = `pages/${i}.${j}.png`;
            img.alt = '';
            flipbook.appendChild(img);
        }
    }
    const backCover = document.createElement("img");
    backCover.src = 'pages/1.2.png';
    backCover.alt = '';
    flipbook.appendChild(backCover);

    let height = window.innerHeight * 0.8;
    let width = height * 1.5;   

    const $flipbook = $(".flipbook");

    $flipbook.turn({
        width: width,
        height: height,
        page: 2
    });

    const totalPageCount = $flipbook.turn("pages");

    $("#prev-page").on("click", function() {
        $flipbook.turn("previous");
    });

    $("#next-page").on("click", function() {
        $flipbook.turn("next");
    });

    $("#first-page").on("click", function() {
        $flipbook.turn("page", 1); 
    });

    $("#last-page").on("click", function() {
        $flipbook.turn("page", totalPageCount);
    });

    // $("#goto-page-btn").on("click", function() {

    //     if (pageNum >= 1 && pageNum <= totalPageCount) {

  </script>
</body>

</html>
